<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AutoAttend AI Attendance System</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 50%, #E0E7FF 100%);
      padding: 1.5rem;
    }

    .login-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-icon-box {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary) 0%, #6366F1 100%);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      margin-bottom: 1rem;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.35);
    }

    .demo-credentials-banner {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      border-radius: var(--radius-md);
      padding: 0.875rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.8125rem;
      color: #166534;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0.25rem;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </div>
      <h1 style="font-size: 1.625rem; font-weight: 800; letter-spacing: -0.02em;">AutoAttend</h1>
      <p style="color: var(--text-muted); font-size: 0.9375rem; margin-top: 0.25rem;">
        Smarter attendance. Less paperwork.
      </p>
    </div>

    <!-- Development Demo Credentials Box -->
    <div class="demo-credentials-banner">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem;">
        <span style="font-weight: 700; color: #15803D;">DEMO CREDENTIALS (DEV MODE)</span>
        <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemoCredentials()" style="padding: 2px 8px; font-size: 0.75rem;">
          Autofill
        </button>
      </div>
      <div>Email: <b>teacher@autoattend.ai</b></div>
      <div>Password: <b>password123</b></div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="login-email" class="form-label">Email</label>
        <input type="email" id="login-email" class="form-input" placeholder="name@college.edu.in" required>
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <div class="password-wrapper">
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
          <button type="button" class="toggle-password-btn" id="toggle-password" title="Show/Hide Password">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-muted); cursor: pointer;">
          <input type="checkbox" id="remember-me" checked>
          <span>Remember me</span>
        </label>
        <a href="javascript:void(0)" onclick="showToast('Please contact administrator for password recovery', 'info')" style="font-size: 0.8125rem; color: var(--primary); font-weight: 600; text-decoration: none;">Forgot password?</a>
      </div>

      <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.9375rem;">
        Sign In to Portal
      </button>
      <p style="margin: 1rem 0 0; font-size: 0.75rem; color: var(--text-muted); text-align: center; line-height: 1.45;">
        Teacher: teacher@autoattend.ai · Students use their college email. Password for the demo accounts is password123.
      </p>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/app.js"></script>

<script>
  function fillDemoCredentials() {
    document.getElementById('login-email').value = 'teacher@autoattend.ai';
    document.getElementById('login-password').value = 'password123';
  }

  // Toggle Password Visibility
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('login-password');
  toggleBtn?.addEventListener('click', () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
    } else {
      passwordInput.type = 'password';
    }
  });

  // Handle Login Submit
  document.getElementById('login-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const remember = document.getElementById('remember-me').checked;
    const btn = document.getElementById('btn-login-submit');

    btn.textContent = 'Verifying credentials...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, remember })
      });
      const data = await res.json();

      if (data.success) {
        showToast(data.message, 'success');
        setTimeout(() => {
          window.location.href = data.user.role === 'student' ? '/student-portal' : '/dashboard';
        }, 600);
      } else {
        showToast(data.message || 'Login failed', 'danger');
        btn.textContent = 'Sign In to Portal';
        btn.disabled = false;
      }
    } catch (err) {
      showToast('Network error connecting to AutoAttend server.', 'danger');
      btn.textContent = 'Sign In to Portal';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
